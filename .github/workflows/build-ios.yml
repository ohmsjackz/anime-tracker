name: Build Unsigned iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Locate SwiftPM Directory
        run: |
          SWIFT_PM_DIR=$(find . -maxdepth 1 -name "*.swiftpm" | head -n 1)
          if [ -z "$SWIFT_PM_DIR" ]; then
            echo "No .swiftpm folder found at root!"
            exit 1
          fi
          echo "PROJECT_DIR=$SWIFT_PM_DIR" >> $GITHUB_ENV
          echo "Found project at $SWIFT_PM_DIR"

      - name: Show available schemes
        run: |
          cd "${{ env.PROJECT_DIR }}"
          xcodebuild -list || true
          ls -la
          ls -la Sources || true

      - name: Build Unsigned App Binary
        run: |
          cd "${{ env.PROJECT_DIR }}"

          # Try common scheme names
          SCHEME="App"
          if ! xcodebuild -list 2>/dev/null | grep -q "App"; then
            SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME="AnimeTracker"
          fi
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package into IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Build/Products/*" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found! Listing DerivedData:"
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -type d 2>/dev/null | head -50 || true
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Using app at: $APP_PATH"
          rm -rf Payload app.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload
          ls -la app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: app.ipa
